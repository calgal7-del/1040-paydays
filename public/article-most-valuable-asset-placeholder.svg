<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The most valuable asset you will ever own</title>
  <desc id="desc">A warm desk illustration showing a paycheck, resume, notebook, and income growth chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#edf7f0"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5e34"/>
      <stop offset="1" stop-color="#c08a57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="165" r="130" fill="#facc15" opacity="0.22"/>
  <circle cx="260" cy="190" r="105" fill="#38bdf8" opacity="0.16"/>
  <rect y="620" width="1600" height="280" fill="url(#desk)"/>
  <g filter="url(#shadow)">
    <rect x="275" y="220" width="445" height="315" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="6"/>
    <text x="320" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">PAYCHECK</text>
    <rect x="320" y="325" width="330" height="20" rx="10" fill="#dbeafe"/>
    <rect x="320" y="370" width="250" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="320" y="414" width="330" height="18" rx="9" fill="#e2e8f0"/>
    <text x="320" y="485" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1f766e">$1,040</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="185" width="470" height="390" rx="24" fill="#0f172a"/>
    <rect x="870" y="235" width="370" height="260" rx="12" fill="#f8fafc"/>
    <polyline points="910,455 975,410 1040,425 1105,350 1170,315 1210,270" fill="none" stroke="#1f766e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1210" cy="270" r="18" fill="#f59e0b"/>
    <text x="1055" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">EARNING POWER</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="515" y="510" width="390" height="245" rx="18" fill="#fffaf3" stroke="#d6b98c" stroke-width="6"/>
    <text x="560" y="575" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">RESUME</text>
    <rect x="560" y="620" width="280" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="560" y="658" width="315" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="560" y="696" width="220" height="16" rx="8" fill="#cbd5e1"/>
  </g>
  <g>
    <rect x="1000" y="655" width="260" height="70" rx="35" fill="#1f766e"/>
    <text x="1130" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">KEEP LEARNING</text>
  </g>
  <text x="800" y="830" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#0f172a">The Most Valuable Asset You'll Ever Own</text>
</svg>
