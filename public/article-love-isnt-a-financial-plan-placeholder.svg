    <text x="112" y="445" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">Love Is Wonderful.</text>
    <text x="112" y="565" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700">It Just Isn't a Financial Plan.</text>
    <text x="120" y="650" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" opacity=".84">Build a future that gives everyone more freedom.</text>
    <text x="120" y="760" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3" opacity=".58">FEATURED IMAGE COMING SOON</text>
