<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Love Is Wonderful image coming soon</title>
  <desc id="description">A warm editorial placeholder for an article about love and financial independence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061936"/>
      <stop offset=".6" stop-color="#183d72"/>
      <stop offset="1" stop-color="#7d45ff"/>
    </linearGradient>
    <radialGradient id="warmth" cx="84%" cy="20%" r="55%">
      <stop offset="0" stop-color="#f5a400" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f5a400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#warmth)"/>
  <circle cx="1290" cy="190" r="245" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
  <path d="M1130 900C1200 690 1375 560 1600 520V900Z" fill="#fff" fill-opacity=".055"/>
  <g fill="#fff">
