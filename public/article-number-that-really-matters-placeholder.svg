<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The Number That Really Matters image coming soon</title>
  <desc id="description">A reflective editorial placeholder for an article about the finite number of paydays in a career.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061936"/>
      <stop offset=".62" stop-color="#0a376d"/>
      <stop offset="1" stop-color="#176bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="84%" cy="16%" r="56%">
      <stop offset="0" stop-color="#00a6a6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#00a6a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="1210" y="670" fill="#fff" fill-opacity=".055" font-family="Georgia, 'Times New Roman', serif" font-size="460" font-weight="700" text-anchor="middle">1,040</text>
  <path d="M1050 900C1150 690 1340 560 1600 525V900Z" fill="#fff" fill-opacity=".05"/>
  <g fill="#fff">
    <text x="120" y="315" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="8" opacity=".72">PAYDAYS · TIME · INTENTION</text>
    <text x="112" y="465" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">The Number That</text>
    <text x="112" y="575" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">Really Matters</text>
    <text x="120" y="662" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" opacity=".84">Your career contains a limited number of opportunities.</text>
    <text x="120" y="765" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3" opacity=".58">FEATURED IMAGE COMING SOON</text>
  </g>
</svg>
