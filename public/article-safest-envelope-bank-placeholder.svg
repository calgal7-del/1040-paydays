<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The safest envelope is at the bank</title>
  <desc id="desc">A savings envelope, bank building, deposit record, and protected cash on a warm desk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5e34"/>
      <stop offset="1" stop-color="#c08a57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="165" r="130" fill="#facc15" opacity="0.22"/>
  <circle cx="275" cy="210" r="110" fill="#38bdf8" opacity="0.14"/>
  <rect y="650" width="1600" height="250" fill="url(#desk)"/>
  <g filter="url(#shadow)">
    <rect x="230" y="300" width="500" height="315" rx="24" fill="#fffaf3" stroke="#d6b98c" stroke-width="7"/>
    <path d="M235 315l245 170 245-170" fill="none" stroke="#d6b98c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">SAVINGS</text>
    <text x="480" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#475569">not hiding places</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="865" y="250" width="455" height="365" rx="26" fill="#0f172a"/>
    <path d="M920 360h345L1092 255z" fill="#1f766e"/>
    <rect x="940" y="370" width="42" height="170" fill="#f8fafc"/>
    <rect x="1032" y="370" width="42" height="170" fill="#f8fafc"/>
    <rect x="1124" y="370" width="42" height="170" fill="#f8fafc"/>
    <rect x="1216" y="370" width="42" height="170" fill="#f8fafc"/>
    <rect x="910" y="540" width="375" height="38" rx="19" fill="#e2e8f0"/>
    <text x="1095" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">BANK RECORDS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="545" width="420" height="245" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="6"/>
    <text x="650" y="610" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#0f172a">DEPOSIT RECORD</text>
    <rect x="650" y="655" width="270" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="650" y="695" width="220" height="16" rx="8" fill="#cbd5e1"/>
    <circle cx="915" cy="710" r="38" fill="#1f766e"/>
    <path d="M897 710l14 14 28-36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="290" y="640" width="310" height="66" rx="33" fill="#1f766e"/>
    <text x="445" y="684" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">INTEREST + PROTECTION</text>
  </g>
  <text x="800" y="840" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#0f172a">The Safest Envelope Is at the Bank</text>
</svg>
