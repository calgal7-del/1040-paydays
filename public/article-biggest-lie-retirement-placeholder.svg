<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The Biggest Lie About Retirement image coming soon</title>
  <desc id="description">A warm editorial placeholder for an article about retirement and freedom.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061936"/>
      <stop offset=".58" stop-color="#0a4371"/>
      <stop offset="1" stop-color="#00a6a6"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="88%" cy="18%" r="58%">
      <stop offset="0" stop-color="#f5a400" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#f5a400" stop-opacity=".13"/>
      <stop offset="1" stop-color="#f5a400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#sunlight)"/>
  <circle cx="1360" cy="170" r="180" fill="#fff" fill-opacity=".035"/>
  <path d="M960 900C1100 650 1320 520 1600 490V900Z" fill="#fff" fill-opacity=".055"/>
