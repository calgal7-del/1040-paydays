    <text x="112" y="455" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="700">The Biggest Lie</text>
    <text x="112" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="700">About Retirement</text>
    <text x="120" y="658" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" opacity=".84">Retirement is not a birthday. It is the freedom to choose.</text>
    <text x="120" y="765" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3" opacity=".58">FEATURED IMAGE COMING SOON</text>
